<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="GearUP – Vehicle Rental Platform" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!--
      OWASP A05 – Security Misconfiguration
      Content-Security-Policy restricts which resources the browser may load.
      This prevents XSS, data-injection, clickjacking, and mixed-content attacks.

      Explanation of each directive:
        default-src 'self'              — only load from same origin by default
        script-src 'self'               — no inline scripts, no eval()
        style-src 'self' 'unsafe-inline'— allow inline styles (React/CRA requirement)
        img-src                         — restrict image origins to our CDN + trusted list
        connect-src                     — restrict XHR/fetch to Firebase endpoints only
        font-src 'self'                 — no external fonts by default
        frame-ancestors 'none'          — OWASP A05 – prevent clickjacking (like X-Frame-Options DENY)
        form-action 'self'              — prevent form submission hijacking
        base-uri 'self'                 — prevent <base> tag injection
        object-src 'none'              — disallow Flash/plugins
    -->
    <meta http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: https://firebasestorage.googleapis.com https://storage.googleapis.com https://lh3.googleusercontent.com https://upload.wikimedia.org https://www.shutterstock.com https://www.apple.com https://via.placeholder.com;
        connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com;
        font-src 'self';
        frame-ancestors 'none';
        form-action 'self';
        base-uri 'self';
        object-src 'none';
      "
    />

    <!-- OWASP A05 – Prevent MIME-type sniffing -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />

    <!-- OWASP A05 – Prevent clickjacking (belt-and-suspenders with CSP frame-ancestors) -->
    <meta http-equiv="X-Frame-Options" content="DENY" />

    <!-- OWASP A05 – Force HTTPS, include subdomains -->
    <meta http-equiv="Strict-Transport-Security" content="max-age=31536000; includeSubDomains" />

    <!-- OWASP A05 – Control referrer information leaked to third parties -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- OWASP A05 – Disable browser features not needed by the app -->
    <meta http-equiv="Permissions-Policy"
      content="camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=()"
    />

    <title>GearUP – Vehicle Rental</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
