name: CI/CD Pipeline – OWASP Top 10 Security

# ================================================================
# GearUP Vehicle Rental App – Security-Hardened CI/CD Pipeline
#
# All 10 OWASP categories are addressed here:
#   A01 – Broken Access Control        → ZAP DAST scan
#   A02 – Cryptographic Failures       → TruffleHog secret scan
#   A03 – Injection / XSS              → Semgrep SAST + ZAP
#   A04 – Insecure Design              → Semgrep SAST
#   A05 – Security Misconfiguration    → ZAP headers check + GENERATE_SOURCEMAP=false
#   A06 – Vulnerable Components        → npm audit (gated build)
#   A07 – Auth Failures                → Semgrep auth pattern rules
#   A08 – Software Integrity           → dependency hash lockfile (npm ci)
#   A09 – Security Logging             → TruffleHog + audit reports uploaded as artifacts
#   A10 – SSRF                         → Semgrep SSRF ruleset
# ================================================================

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ──────────────────────────────────────────────────────────────
  # OWASP A02 / A09 – Secret Scanning (TruffleHog)
  # Blocks the pipeline immediately if credentials are leaked in code.
  # Runs FIRST so leaked secrets never reach build or registry.
  # ──────────────────────────────────────────────────────────────
  secret-scan:
    name: "OWASP A02/A09 – Secret Scan (TruffleHog)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog – Scan for leaked secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.sha }}
          extra_args: --only-verified

  # ──────────────────────────────────────────────────────────────
  # OWASP A06 / A08 – Dependency Vulnerability Audit
  # npm ci uses the lockfile for reproducible, integrity-verified installs.
  # npm audit flags known CVEs in production dependencies.
  # ──────────────────────────────────────────────────────────────
  dependency-audit:
    name: "OWASP A06/A08 – Dependency Audit (npm audit)"
    runs-on: ubuntu-latest
    needs: secret-scan
    defaults:
      run:
        working-directory: final-demo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: final-demo/package-lock.json

      # OWASP A08 – npm ci uses lockfile hash verification
      - name: Install Dependencies (npm ci)
        run: npm ci

      # OWASP A06 – Fail if any CRITICAL CVE found in production deps
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

      # OWASP A09 – Save full report as artifact for review
      - name: Save full audit report
        if: always()
        run: npm audit --json > npm-audit-report.json || true

      - name: Upload audit report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-a06-npm-audit-report
          path: final-demo/npm-audit-report.json
          retention-days: 30

  # ──────────────────────────────────────────────────────────────
  # OWASP A03 / A04 / A07 / A10 – Static Application Security Testing
  # Semgrep scans source code for injection patterns, insecure design,
  # auth flaws, and SSRF using the official OWASP Top 10 ruleset.
  # ──────────────────────────────────────────────────────────────
  sast-scan:
    name: "OWASP A03/A04/A07/A10 – SAST (Semgrep)"
    runs-on: ubuntu-latest
    needs: secret-scan

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Semgrep – OWASP Top 10 SAST scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/owasp-top-ten
            p/javascript
            p/react
            p/secrets
        env:
          # Optional: set SEMGREP_APP_TOKEN secret in GitHub repo settings
          # to see results in the Semgrep dashboard (semgrep.dev)
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        continue-on-error: true   # Non-blocking: results stored as artifact

      - name: Upload Semgrep SARIF report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-a03-semgrep-sast-report
          path: semgrep.sarif
          retention-days: 30

  # ──────────────────────────────────────────────────────────────
  # Build – gated on all security checks passing
  # OWASP A05 – source maps are disabled in production build
  # ──────────────────────────────────────────────────────────────
  build:
    name: "Build (gated on security checks)"
    runs-on: ubuntu-latest
    needs: [dependency-audit, sast-scan]
    defaults:
      run:
        working-directory: final-demo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: final-demo/package-lock.json

      - name: Install Dependencies
        run: npm ci

      # OWASP A05 – Never expose source maps in production
      - name: Build (no source maps)
        run: npm run build
        env:
          CI: false
          GENERATE_SOURCEMAP: false

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: final-demo/build/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────
  # Deploy to Firebase Hosting
  # ──────────────────────────────────────────────────────────────
  deploy:
    name: "Deploy to Firebase Hosting"
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: final-demo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: final-demo/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build (no source maps)
        run: npm run build
        env:
          CI: false
          GENERATE_SOURCEMAP: false

      - name: Deploy to Firebase
        run: npm install -g firebase-tools && firebase deploy --only hosting --token "$FIREBASE_TOKEN" --project gearup-1aae6
        working-directory: ${{ github.workspace }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

  # ──────────────────────────────────────────────────────────────
  # OWASP A01 / A03 / A05 – Dynamic Application Security Testing
  # OWASP ZAP scans the LIVE deployed app for:
  #   - Missing security headers (A05)
  #   - XSS vulnerabilities (A03)
  #   - Broken access control on endpoints (A01)
  #   - Open redirects, clickjacking, mixed content
  # Runs AFTER deploy so it tests the real production environment.
  # ──────────────────────────────────────────────────────────────
  zap-dast-scan:
    name: "OWASP A01/A03/A05 – DAST (OWASP ZAP)"
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ZAP Baseline Scan – live site
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'https://gearup-1aae6.web.app/'
          fail_action: false
          allow_issue_writing: false
          artifact_name: owasp-zap-dast-report
