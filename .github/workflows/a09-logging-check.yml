name: A09 - Logging Enforcement (Improved)

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  logging-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Check logging presence
        run: |
          echo "Checking logging usage..."

          COUNT=$(grep -r -E "logger|winston|pino|console\.log" . | wc -l)

          if [ "$COUNT" -lt 5 ]; then
            echo " Not enough logging in project"
            exit 1
          fi

      - name: Ensure error logging exists
        run: |
          if ! grep -r -E "error|exception|fail" .; then
            echo " No proper error logging found"
            exit 1
          fi

      - name: Detect sensitive data exposure in logs
        run: |
          echo "Checking for unsafe logging..."

          EXCLUDE="--exclude-dir=.git --exclude=package-lock.json --exclude=*.yml"

          # Check console logging
          if grep -r -E "console\.log.*(password|token|secret)" . $EXCLUDE; then
            echo "Sensitive data exposed via console.log"
            exit 1
          fi

          # Check logger usage
          if grep -r -E "logger.*(password|token|secret)" . $EXCLUDE; then
            echo "Sensitive data exposed via logger"
            exit 1
          fi

          echo "✅ No sensitive data exposed in logs"
