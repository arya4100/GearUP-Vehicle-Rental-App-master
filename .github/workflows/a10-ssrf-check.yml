name: A10 - SSRF Protection Check

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"

jobs:
  ssrf-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect unsafe URL usage
        run: |
          EXCLUDE="--exclude-dir=.git --exclude-dir=.github --exclude=package-lock.json"

          if grep -r -E "fetch\(.*req\.|axios\.get\(.*req\.|http\.get\(.*req\." . $EXCLUDE; then
            echo "SSRF risk: user input used directly in request"
            exit 1
          fi

      - name: Detect dangerous protocols
        run: |
          EXCLUDE="--exclude-dir=.git --exclude-dir=.github --exclude=package-lock.json"

          if grep -r -E "file://|ftp://|gopher://|http://169\.254\.169\.254" . $EXCLUDE; then
            echo "Dangerous protocol detected"
            exit 1
          fi

      - name: Check URL validation
        run: |
          EXCLUDE="--exclude-dir=.git --exclude-dir=.github --exclude=package-lock.json"

          if ! grep -r -E "new URL\(|validator\.isURL|validateURL" . $EXCLUDE; then
            echo "No URL validation detected"
            exit 1
          fi

      - name: Check domain whitelist
        run: |
          EXCLUDE="--exclude-dir=.git --exclude-dir=.github --exclude=package-lock.json"

          if ! grep -r -E "whitelist|allowedDomains|trustedHosts" . $EXCLUDE; then
            echo "No domain whitelist found"
            exit 1
          fi

      - name: Detect internal access patterns
        run: |
          EXCLUDE="--exclude-dir=.git --exclude-dir=.github --exclude=package-lock.json"

          if grep -r -E "localhost|127\.0\.0\.1|0\.0\.0\.0" . $EXCLUDE; then
            echo "Internal network references found"
          fi

      - name: SSRF checks passed
        run: echo "SSRF protection checks passed"
